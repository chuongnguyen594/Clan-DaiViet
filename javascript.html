function taoBang(data){

  if (!data || data.length == 0){
    return `
      <div style="
      text-align:center;
      padding:30px;
      color:#ffcc00;
      font-size:22px;">
      Không có dữ liệu
      </div>`;
  }

  let html = `
  <div style="overflow-x:auto">

  <table style="
  width:max-content;
  border-collapse:collapse;
  font-size:16px;
  text-align:center;
  background:#111;
  color:white;
  min-width:1200px;
">

  <thead>

  <tr style="
  background:linear-gradient(90deg,#b30000,#ff0000);
  color:#fff;
  position:sticky;
  top:0;
  z-index:10;
  ">`;

  // Tiêu đề
  data[0].forEach(function(cell){

    html += `
    <th style="
    border:1px solid #555;
    padding:12px;
    white-space:nowrap;
    ">
    ${cell}
    </th>`;

  });

  html += "</tr></thead><tbody>";

  // Dữ liệu
  for(let r=1;r<data.length;r++){

    let mau = (r%2==0) ? "#1b1b1b" : "#111";

    // Tô màu Top 1 và Top 2
    if(data[r][0]=="1" || data[r][0]=="🥇"){
        mau="#006400";      // Xanh lá
    }

    else if(data[r][0]=="2" || data[r][0]=="🥈"){
        mau="#8B8000";      // Vàng
    }

    html += `<tr style="background:${mau};">`;

    data[r].forEach(function(cell){

      html += `
      <td style="
      border:1px solid #444;
      padding:10px;
      white-space:nowrap;
      ">
      ${cell==null?"":cell}
      </td>`;

    });

    html += "</tr>";
  }

  html += `
  </tbody>
  </table>
  </div>`;

  return html;

}

// ==========================================
// GỬI ĐĂNG KÝ
// ==========================================

function guiDangKyBayCup2(){

    const zaloElement =
        document.getElementById("bay2_zalo");

    const soAccElement =
        document.getElementById("bay2_soAcc");

    if(!zaloElement || !soAccElement){

        alert("❌ Không tìm thấy biểu mẫu đăng ký!");
        return;

    }

    const zalo = zaloElement.value.trim();

    const soAcc = Number(soAccElement.value);

    if(!zalo){

        alert("⚠️ Vui lòng nhập Zalo!");
        zaloElement.focus();
        return;

    }

    let danhSachAcc = [];

    for(let i = 1; i <= soAcc; i++){

        const nick =
            document.getElementById("bay2_nick" + i).value.trim();

        const code =
            document.getElementById("bay2_code" + i).value.trim();

        if(!nick){

            alert("⚠️ Vui lòng nhập Nick game acc " + i + "!");
            return;

        }

        if(!code){

            alert("⚠️ Vui lòng nhập Mã code acc " + i + "!");
            return;

        }

        danhSachAcc.push({
            nick: nick,
            code: code
        });

    }

    // Khóa nút trong lúc gửi
    const buttons =
        document.querySelectorAll("#formBayCup2 button");

    buttons.forEach(function(btn){
        btn.disabled = true;
        btn.innerText = "⏳ ĐANG GỬI...";
    });


    google.script.run

    .withSuccessHandler(function(result){

        if(result && result.status === "success"){

            alert("✅ ĐĂNG KÝ BAY CÚP HUYỀN THOẠI 2 THÀNH CÔNG!");

            document.getElementById("formBayCup2").innerHTML = "";

            taiDanhSachBayCup2();

        }else{

            alert(
                "❌ " +
                (result && result.message
                    ? result.message
                    : "Đăng ký thất bại!")
            );

            buttons.forEach(function(btn){
                btn.disabled = false;
                btn.innerText = "✅ GỬI ĐĂNG KÝ";
            });

        }

    })

    .withFailureHandler(function(error){

        console.error(error);

        alert(
            "❌ Lỗi hệ thống: " +
            (error && error.message
                ? error.message
                : "Không xác định")
        );

        buttons.forEach(function(btn){
            btn.disabled = false;
            btn.innerText = "✅ GỬI ĐĂNG KÝ";
        });

    })

    .dangKyBayCupHuyenThoai2(
        zalo,
        danhSachAcc
    );

}

function taiDanhSachBayCup2(){

    const box =
        document.getElementById("dsBayCup2");

    if(!box) return;

    box.innerHTML =
        "⏳ Đang tải danh sách...";


    google.script.run

    .withSuccessHandler(function(data){

        box.innerHTML =
            taoBangBayCup2(data);

    })

    .withFailureHandler(function(error){

        box.innerHTML =
            `
            <div style="
                color:#ff4444;
                text-align:center;
                padding:25px;
            ">
                ❌ Không tải được danh sách
                <br>
                ${error && error.message
                    ? error.message
                    : ""}
            </div>
            `;

    })

    .getBayCupHuyenThoai2();

}

    html += `

function guiDangKyBayCup1(){

    const zalo =
        document.getElementById("bay1_zalo").value.trim();

    const soAcc =
        Number(document.getElementById("bay1_soAcc").value);

    if(!zalo){

        alert("Vui lòng nhập Zalo!");
        return;

    }

    let params = new URLSearchParams();

    params.append(
        "action",
        "DangKyBayCupHuyenThoai1"
    );

    params.append("zalo", zalo);
    params.append("soAcc", soAcc);

    for(let i=1; i<=soAcc; i++){

        const nick =
            document.getElementById(
                "bay1_nick"+i
            ).value.trim();

        const code =
            document.getElementById(
                "bay1_code"+i
            ).value.trim();

        if(!nick){

            alert(
                "Vui lòng nhập Nick game acc "+i
            );

            return;
        }

        if(!code){

            alert(
                "Vui lòng nhập Mã code acc "+i
            );

            return;
        }

        params.append("nick"+i, nick);
        params.append("code"+i, code);

    }


    fetch("?"+params.toString())

    .then(res => res.json())

    .then(data => {

        if(data.status === "success"){

            alert("✅ Đăng ký thành công!");

            document.getElementById(
                "formBayCup1"
            ).innerHTML = "";

            taiDanhSachBayCup1();

        }else{

            alert("❌ "+data.message);

        }

    })

    .catch(err => {

        console.error(err);

        alert("❌ Không thể gửi đăng ký!");

    });

}


function taiDanhSachBayCup1(){

    google.script.run

    .withSuccessHandler(function(data){

        document.getElementById(
            "dsBayCup1"
        ).innerHTML =
            taoBangBayCup1(data);

    })

    .withFailureHandler(function(err){

        document.getElementById(
            "dsBayCup1"
        ).innerHTML =
            "❌ Lỗi tải danh sách: "+err.message;

    })

    .getBayCupHuyenThoai1();

}
