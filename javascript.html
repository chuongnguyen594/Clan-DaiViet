function taoBang(data){

  if (!data || data.length == 0){
    return `
      <div style="
      text-align:center;
      padding:30px;
      color:#ffcc00;
      font-size:22px;">
      Không có dữ liệu
      </div>`;
  }

  let html = `
  <div style="overflow-x:auto">

  <table style="
  width:max-content;
  border-collapse:collapse;
  font-size:16px;
  text-align:center;
  background:#111;
  color:white;
  min-width:1200px;
">

  <thead>

  <tr style="
  background:linear-gradient(90deg,#b30000,#ff0000);
  color:#fff;
  position:sticky;
  top:0;
  z-index:10;
  ">`;

  // Tiêu đề
  data[0].forEach(function(cell){

    html += `
    <th style="
    border:1px solid #555;
    padding:12px;
    white-space:nowrap;
    ">
    ${cell}
    </th>`;

  });

  html += "</tr></thead><tbody>";

  // Dữ liệu
  for(let r=1;r<data.length;r++){

    let mau = (r%2==0) ? "#1b1b1b" : "#111";

    // Tô màu Top 1 và Top 2
    if(data[r][0]=="1" || data[r][0]=="🥇"){
        mau="#006400";      // Xanh lá
    }

    else if(data[r][0]=="2" || data[r][0]=="🥈"){
        mau="#8B8000";      // Vàng
    }

    html += `<tr style="background:${mau};">`;

    data[r].forEach(function(cell){

      html += `
      <td style="
      border:1px solid #444;
      padding:10px;
      white-space:nowrap;
      ">
      ${cell==null?"":cell}
      </td>`;

    });

    html += "</tr>";
  }

  html += `
  </tbody>
  </table>
  </div>`;

  return html;

}
